name: Build/Release (Linux archs)

on:
  workflow_dispatch:
    inputs:
      libunwind-version:
        description: 'libunwind git tag to build'
        default: 'v1.8.3'
  push:
    branches:
      - master
      - devel
  pull_request:
    paths:
      - .github/workflows/build_release_arch.yml
      - scripts/build-in-manylinux.sh
      - scripts/build-in-musllinux.sh
      - scripts/build-wheel.py
      - scripts/requirements-bw.txt
      - src/**
      - configure.ac
      - Makefile.am
  release:
    types: [published]

env:
  LIBUNWIND_VERSION: ${{ inputs.libunwind-version || 'v1.8.3' }}

permissions:
  contents: write

jobs:
  release-linux-archs-glibc:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: armv7
            wheel_arch: armv7l
            platform: linux/arm/v7
            # armv7l has no manylinux2014/_2_28 image; _2_31 (Ubuntu 20.04
            # based) is the lowest glibc baseline pypa publishes for it.
            image: quay.io/pypa/manylinux_2_31_armv7l
          - arch: ppc64le
            wheel_arch: ppc64le
            platform: linux/ppc64le
            # manylinux2014_ppc64le's CentOS-7 altarch vault mirror returns
            # HTTP 403 (dead EOL repo); manylinux_2_28 (AlmaLinux 8) has a
            # maintained mirror and is the next available ppc64le baseline.
            image: quay.io/pypa/manylinux_2_28_ppc64le
      fail-fast: false
    name: Build (glibc) on ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v3
        name: Checkout sources

      # QEMU-emulated builds are slow; cache libunwind (the only thing here
      # built from source) across runs rather than rebuilding it every time.
      # build-in-manylinux.sh skips its clone+build when this is already
      # populated. Not done for release.yml's native x86_64/aarch64 jobs yet
      # -- worth doing there too as a separate follow-up.
      - name: Cache libunwind for ${{ matrix.arch }}
        uses: actions/cache@v4
        with:
          path: .libunwind-cache
          key: libunwind-${{ matrix.arch }}-${{ env.LIBUNWIND_VERSION }}

      - uses: uraimo/run-on-arch-action@v3
        name: Build Austin on ${{ matrix.arch }}
        with:
          arch: none
          distro: none
          base_image: --platform=${{ matrix.platform }} ${{ matrix.image }}
          githubToken: ${{ github.token }}
          dockerRunArgs: --volume "${GITHUB_WORKSPACE}/.libunwind-cache:/opt/libunwind"
          setup: |
            mkdir -p .libunwind-cache
          env: |
            ARCH: ${{ matrix.wheel_arch }}
            LIBUNWIND_VERSION: ${{ env.LIBUNWIND_VERSION }}
          run: bash scripts/build-in-manylinux.sh

      - name: Read build outputs
        id: tag
        run: cat .build-outputs >> "$GITHUB_OUTPUT"

      - name: Show artifacts
        run: ls -al src/austin*.tar.xz

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release' && github.event.action == 'published'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src/austin*.tar.xz
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build wheel
        run: |
          python3.10 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r scripts/requirements-bw.txt

          # FT Python has no official builds for armv7/ppc64le.
          python scripts/build-wheel.py \
            --version=${{ steps.tag.outputs.version }} \
            --platform=${{ steps.tag.outputs.platform }} \
            --no-free-threaded \
            --files austin:src/austin austinp:src/austinp

          deactivate

      - name: Save wheels as job artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ steps.tag.outputs.platform }}
          path: dist/*.whl

      - name: Upload wheels
        if: github.event_name == 'release' && github.event.action == 'published'
        run: |
          source .venv/bin/activate
          twine upload dist/*.whl --username __token__ --password ${{ secrets.PYPI_TOKEN }}
          deactivate

  release-linux-archs-musl:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: armv7
            wheel_arch: armv7l
            platform: linux/arm/v7
            image: quay.io/pypa/musllinux_1_2_armv7l
          - arch: ppc64le
            wheel_arch: ppc64le
            platform: linux/ppc64le
            image: quay.io/pypa/musllinux_1_2_ppc64le
      fail-fast: false
    name: Build (musl) on ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v3
        name: Checkout sources

      - uses: uraimo/run-on-arch-action@v3
        name: Build Austin (musl) on ${{ matrix.arch }}
        with:
          arch: none
          distro: none
          base_image: --platform=${{ matrix.platform }} ${{ matrix.image }}
          githubToken: ${{ github.token }}
          shell: /bin/sh
          env: |
            ARCH: ${{ matrix.wheel_arch }}
          run: sh scripts/build-in-musllinux.sh

      - name: Read build outputs
        id: tag
        run: cat .build-outputs >> "$GITHUB_OUTPUT"

      - name: Show artifacts
        run: ls -al src/austin*.tar.xz

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release' && github.event.action == 'published'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src/austin*.tar.xz
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build wheel
        run: |
          python3.10 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r scripts/requirements-bw.txt

          python scripts/build-wheel.py \
            --version=${{ steps.tag.outputs.version }} \
            --platform=${{ steps.tag.outputs.platform }} \
            --no-free-threaded \
            --files austin:src/austin

          deactivate

      - name: Save wheels as job artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ steps.tag.outputs.platform }}
          path: dist/*.whl

      - name: Upload wheels
        if: github.event_name == 'release' && github.event.action == 'published'
        run: |
          source .venv/bin/activate
          twine upload dist/*.whl --username __token__ --password ${{ secrets.PYPI_TOKEN }}
          deactivate
