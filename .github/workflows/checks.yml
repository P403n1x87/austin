name: Checks

on:
  push:
    branches:
      - master
      - devel
  pull_request:
    paths:
      - .github/workflows/checks.yml
      - .github/actions/setup-libunwind/action.yml
      - src/**
      - test/**
      - doc/**
      - configure.ac
      - Makefile.am

jobs:
  changes:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    outputs:
      src: ${{ steps.filter.outputs.src }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - .github/workflows/checks.yml
              - .github/actions/setup-libunwind/action.yml
              - src/**
              - doc/**
              - configure.ac
              - Makefile.am
            tests:
              - .github/workflows/checks.yml
              - test/**

  check-manpage:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.result == 'skipped'
    name: Check docs
    steps:
      - uses: actions/checkout@v3

      - name: Setup libunwind
        uses: ./.github/actions/setup-libunwind

      - name: Install build dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo add-apt-repository -y ppa:inkscape.dev/stable
          sudo apt-get update
          sudo apt-get -y install binutils-dev libiberty-dev liblzma-dev zlib1g-dev libzstd-dev \
            help2man inkscape

      - name: Compile Austin
        run: |
          autoreconf --install
          ./configure
          make

      - name: Generate docs
        run: bash doc/gen.sh

      - name: Check docs
        run: git diff -I".* DO NOT MODIFY.*" -I"[.]TH AUSTIN.*" --exit-code src/austin.1

  cppcheck-linux:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.result == 'skipped'
    name: Static code analysis (Linux)
    env:
      cppcheck-version: 2.10.3

    steps:
      - uses: actions/checkout@v3

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get -y install cppcheck

      - name: Check source code
        run: cppcheck -q -f --error-exitcode=1 --inline-suppr src

  cppcheck-macos:
    name: Static code analysis (macOS)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.result == 'skipped'
    steps:
      - uses: actions/checkout@v3
      
      - name: Install cppcheck
        run: brew install cppcheck
      
      - name: Check source code
        run: cppcheck -q -f --error-exitcode=1 --inline-suppr --check-level=exhaustive src

  codespell:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.result == 'skipped'
    name: Codespell
    steps:
      - uses: actions/checkout@v3

      - uses: "actions/setup-python@v4"
        with:
          python-version: "3.9"

      - name: Install codespell
        run: pip install codespell~=2.4

      - name: Check source code spelling
        run: codespell -I .github/workflows/wordlist.txt -S "src/python/*" src

  formatting-sources:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.result == 'skipped'
    name: Formatting (sources)
    steps:
      - uses: actions/checkout@v3

      - name: Install clang-format
        run: pip install clang-format~=22.1.1

      - name: Check formatting
        run: find src -name "*.c" -o -name "*.h" | xargs clang-format -style=file --dry-run --Werror

  formatting-tests:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.tests == 'true' || needs.changes.result == 'skipped'
    name: Formatting (tests)
    steps:
      - uses: actions/checkout@v3

      - uses: "actions/setup-python@v4"
        with:
          python-version: "3.10"

      - name: Install black
        run: pip install black~=26.3.1

      - name: Check formatting
        run: black --check --exclude=test/targets test/

  linting-tests:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.tests == 'true' || needs.changes.result == 'skipped'
    name: Linting (tests)
    steps:
      - uses: actions/checkout@v3

      - uses: "actions/setup-python@v4"
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8~=7.3

      - name: Lint code
        run: flake8 --config test/.flake8 test/

  build-coverage:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.result == 'skipped'
    name: Code coverage (build)
    steps:
      - uses: actions/checkout@v3

      - name: Setup libunwind
        uses: ./.github/actions/setup-libunwind

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install binutils-dev libiberty-dev liblzma-dev zlib1g-dev libzstd-dev

      - name: Compile Austin
        run: |
          autoreconf --install
          ./configure --enable-coverage
          make

      - uses: actions/upload-artifact@v4
        with:
          name: austin-coverage-build
          path: |
            src/austin
            src/austinp
            src/*.gcno
          retention-days: 1

  test-coverage:
    runs-on: ubuntu-24.04
    needs: build-coverage
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    name: Code coverage (Python ${{ matrix.python-version }})
    env:
      AUSTIN_TESTS_PYTHON_VERSIONS: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: austin-coverage-build
          path: src

      - run: chmod +x src/austin src/austinp

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}-dev

      - name: Install Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install valgrind gcovr
          python3.13 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r test/requirements.txt

      - name: Run tests
        run: |
          echo "core.%p" | sudo tee /proc/sys/kernel/core_pattern
          ulimit -c unlimited
          .venv/bin/pytest -svr a test/cunit || true
          .venv/bin/pytest -n auto -svr a test/functional || true
          sudo -E env PATH="$PATH" .venv/bin/pytest -n auto -svr a test/functional || true

      - name: Generate coverage tracefile
        run: gcovr --json coverage-py${{ matrix.python-version }}.json -r src/ --gcov-ignore-errors=no_working_dir_found

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage-py${{ matrix.python-version }}.json
          retention-days: 1

  report-coverage:
    runs-on: ubuntu-24.04
    needs: test-coverage
    name: Code coverage (report)
    steps:
      - uses: actions/checkout@v3

      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get -y install gcovr

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-py*
          path: coverage-data/
          merge-multiple: true

      - name: Generate Cobertura report
        shell: bash
        run: |
          args=()
          for f in coverage-data/*.json; do
            args+=(--add-tracefile "$f")
          done
          gcovr "${args[@]}" --xml cobertura.xml -r src/

      - name: Upload report to Codecov
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          verbose: true

  check-cog:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.result == 'skipped'
    name: Check cog output
    steps:
      - uses: actions/checkout@v3

      - name: Install cog
        run: pip install cogapp~=3.6

      - name: Compile Austin
        run: |
          autoreconf --install
          ./configure
          make

      - name: Run cog check
        run: bash scripts/cog.sh --check
